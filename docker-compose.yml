services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jiraclone
      POSTGRES_USER: jiraclone
      POSTGRES_PASSWORD: jiraclone
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiraclone -d jiraclone"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/jiraclone
      DB_USER: jiraclone
      DB_PASSWORD: jiraclone
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
