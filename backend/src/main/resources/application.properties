spring.application.name=backend

# Defaults target a local Postgres; docker compose overrides these via env vars.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jiraclone}
spring.datasource.username=${DB_USER:jiraclone}
spring.datasource.password=${DB_PASSWORD:jiraclone}

# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Simulated routing engine: results arrive after a random delay in this range,
# and this share of requests never returns at all.
routing.min-delay-ms=5000
routing.max-delay-ms=20000
routing.never-return-rate=0.2

# Error responses include the ResponseStatusException reason as "message" (shown in the UI).
spring.web.error.include-message=always
