spring.application.name=backend

# Defaults target a local Postgres; docker compose overrides these via env vars.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jiraclone}
spring.datasource.username=${DB_USER:jiraclone}
spring.datasource.password=${DB_PASSWORD:jiraclone}

# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
